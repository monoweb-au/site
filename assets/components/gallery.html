<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gallery - Photography</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    
<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 0;
}

.gallery-section {
    padding: 110px 5%;
    background: linear-gradient(to bottom, #fefcfb 0%, #fdf8f6 100%);
}

.gallery-header {
    text-align: center;
    margin-bottom: 60px;
}

.gallery-subtitle {
    font-family: 'Inter', sans-serif;
    font-size: 0.85rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.2em;
    color: #d97706;
    margin-bottom: 16px;
}

.gallery-header h2 {
    font-family: 'Cormorant Garamond', serif;
    font-size: clamp(2.8rem, 5vw, 4rem);
    font-weight: 900;
    color: #78350f;
    margin-bottom: 20px;
}

.gallery-header p {
    font-family: 'Inter', sans-serif;
    font-size: 1.1rem;
    color: #78716c;
    max-width: 650px;
    margin: 0 auto;
}

.gallery-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
    gap: 20px;
    max-width: 1400px;
    margin: 0 auto;
}

.gallery-item {
    position: relative;
    border-radius: 12px;
    overflow: hidden;
    aspect-ratio: 1/1;
    cursor: pointer;
    transition: all 0.4s ease;
    animation: fadeIn 0.6s ease-out both;
}

.gallery-item:nth-child(1) { animation-delay: 0.05s; }
.gallery-item:nth-child(2) { animation-delay: 0.1s; }
.gallery-item:nth-child(3) { animation-delay: 0.15s; }
.gallery-item:nth-child(4) { animation-delay: 0.2s; }
.gallery-item:nth-child(5) { animation-delay: 0.25s; }
.gallery-item:nth-child(6) { animation-delay: 0.3s; }

.gallery-item:hover {
    transform: scale(1.02);
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.2);
}

.gallery-item img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    transition: transform 0.6s ease;
}

.gallery-item:hover img {
    transform: scale(1.1);
}

.gallery-overlay {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background: linear-gradient(to top, rgba(120, 53, 15, 0.8) 0%, transparent 60%);
    opacity: 0;
    transition: opacity 0.4s ease;
    display: flex;
    align-items: flex-end;
    padding: 24px;
}

.gallery-item:hover .gallery-overlay {
    opacity: 1;
}

.overlay-text {
    font-family: 'Cormorant Garamond', serif;
    font-size: 1.2rem;
    font-weight: 700;
    color: #ffffff;
}

@keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
}

@media (max-width: 768px) {
    .gallery-section { padding: 70px 5%; }
    .gallery-grid { grid-template-columns: 1fr; gap: 16px; }
    section { padding-left: 0 !important; padding-right: 0 !important; }
}
</style>
</head>
<body>

<section class="gallery-section">
    <div class="gallery-header">
        <div class="gallery-subtitle">Our Portfolio</div>
        <h2>Recent Projects</h2>
        <p>Capturing life's most precious moments with artistry and emotion</p>
    </div>
    
    <div class="gallery-grid">
        <div class="gallery-item">
            <img src="https://picsum.photos/400/400?random=201" alt="Wedding photography">
            <div class="gallery-overlay">
                <div class="overlay-text">Sarah & James Wedding</div>
            </div>
        </div>
        
        <div class="gallery-item">
            <img src="https://picsum.photos/400/400?random=202" alt="Engagement shoot">
            <div class="gallery-overlay">
                <div class="overlay-text">Engagement Session</div>
            </div>
        </div>
        
        <div class="gallery-item">
            <img src="https://picsum.photos/400/400?random=203" alt="Reception photography">
            <div class="gallery-overlay">
                <div class="overlay-text">Reception Celebration</div>
            </div>
        </div>
        
        <div class="gallery-item">
            <img src="https://picsum.photos/400/400?random=204" alt="Bridal portraits">
            <div class="gallery-overlay">
                <div class="overlay-text">Bridal Portraits</div>
            </div>
        </div>
        
    </div>
</section>

</body>
</html>
