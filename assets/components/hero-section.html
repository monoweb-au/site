<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hero Section Demo</title>
<style>
/* Reset for iframe */
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 0;
}


/* Import Fonts */
@import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Roboto:wght@400;700;900&display=swap');

.hero-premium {
    position: relative;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    padding: 0 5%;
    background: linear-gradient(135deg, #dc2626 0%, #ea580c 50%, #f97316 100%);
}

.hero-premium::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background-image: url('hero-section.jpg');
    background-size: cover;
    background-position: center;
    filter: brightness(0.3);
    z-index: 1;
}

.hero-premium::after {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background: linear-gradient(135deg, rgba(220, 38, 38, 0.7) 0%, rgba(234, 88, 12, 0.6) 50%, rgba(249, 115, 22, 0.65) 100%);
    animation: gradientPulse 8s ease-in-out infinite;
    z-index: 2;
}

@keyframes gradientPulse {
    0%, 100% { opacity: 0.7; }
    50% { opacity: 0.5; }
}

.hero-content {
    position: relative;
    z-index: 3;
    text-align: center;
    max-width: 900px;
    animation: fadeInUp 1.2s ease-out;
}

@keyframes fadeInUp {
    from { opacity: 0; transform: translateY(40px); }
    to { opacity: 1; transform: translateY(0); }
}

.hero-content h1 {
    font-family: 'Bebas Neue', sans-serif;
    font-size: clamp(3.5rem, 10vw, 7rem);
    margin-bottom: 1.5rem;
    line-height: 0.95;
    color: #ffffff;
    text-transform: uppercase;
    text-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
}

.hero-content h1 span {
    color: #fbbf24;
    display: block;
}

.hero-content p {
    font-family: 'Roboto', sans-serif;
    font-size: clamp(1.1rem, 2.2vw, 1.4rem);
    color: rgba(255, 255, 255, 0.95);
    margin-bottom: 2.5rem;
    line-height: 1.6;
}

.hero-cta-group {
    display: flex;
    gap: 20px;
    justify-content: center;
    flex-wrap: wrap;
}

.hero-cta {
    display: inline-block;
    padding: 18px 40px;
    font-family: 'Roboto', sans-serif;
    font-size: 1rem;
    font-weight: 700;
    text-decoration: none;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    border-radius: 6px;
    transition: all 0.3s ease;
}

.hero-cta-primary {
    color: #1a1a1a;
    background: #fbbf24;
    box-shadow: 0 10px 40px rgba(251, 191, 36, 0.4);
}

.hero-cta-primary:hover {
    transform: translateY(-3px);
    box-shadow: 0 15px 50px rgba(251, 191, 36, 0.6);
}

.hero-cta-secondary {
    color: #ffffff;
    background: transparent;
    border: 2px solid #ffffff;
}

.hero-cta-secondary:hover {
    background: rgba(255, 255, 255, 0.1);
    transform: translateY(-3px);
}

@media (max-width: 768px) {
    .hero-premium { min-height: 90vh; }
    .hero-cta-group { flex-direction: column; gap: 15px; }
    section { padding-left: 0 !important; padding-right: 0 !important; }
}

</style>
</head>
<body>

<section class="hero-premium">
    <div class="hero-content">
        <h1>Transform Your Body<span>Transform Your Life</span></h1>
        <p>Join Sydney's premier fitness studio. Expert trainers, state-of-the-art equipment, real results.</p>
        <div class="hero-cta-group">
            <a class="hero-cta hero-cta-primary">Start Free Trial</a>
            <a class="hero-cta hero-cta-secondary">View Pricing</a>
        </div>
    </div>
</section>


</body>
</html>
